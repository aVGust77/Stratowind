[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stratowind"
version = "0.1.0"
description = "Open-source toolkit for stratospheric wind analysis for HAPS, high-altitude platforms, and atmospheric research."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "StratoWind Team" }
]
license = "MIT"
keywords = ["stratosphere", "wind", "hap", "weather", "atmosphere", "analysis"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "xarray>=2024.1",
  "plotly>=5.18",
  "streamlit>=1.30"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
stratowind = "stratowind.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["stratowind*"]
